apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup
spec:
  workspaces:
    - name: source
  steps:
    - name: remove-files
      image: alpine:3.20
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        echo "Cleaning workspace..."
        rm -rf ./* ./.??* 2>/dev/null || true
        echo "Workspace cleaned."

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: clone-repository
spec:
  params:
    - name: repo-url
      type: string
  workspaces:
    - name: source
  steps:
    - name: clone
      image: alpine/git:2.45.2
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        echo "Cloning repository: $(params.repo-url)"
        git clone --depth 1 "$(params.repo-url)" .
        echo "Repository cloned successfully."
        git log -1 --oneline

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: verify-files
spec:
  workspaces:
    - name: source
  steps:
    - name: verify
      image: alpine:3.20
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        echo "Verifying repository contents..."
        test -f Dockerfile
        test -f requirements.txt
        test -f service/__init__.py
        echo "Required application files were found."
        ls -la
